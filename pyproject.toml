[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_system"
version = "0.1.0"
description = "Production-grade architecture skeleton for an intraday multi-agent trading system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.0,<3",
]

[project.optional-dependencies]
market-data = [
    "pandas>=2.2.0",
    "yfinance>=0.2.54",
]
ml = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "xgboost>=2.1.0",
]
execution = [
    "ib_insync>=0.9.86",
]
backtest = [
    "pandas>=2.2.0",
]
system = [
    "pandas>=2.2.0",
    "pydantic>=2.13.0,<3",
    "xgboost>=2.1.0",
]
dev = [
    "mypy>=1.11.0,<2",
    "pre-commit>=4.0.0,<5",
    "ruff>=0.6.0,<1",
]

[tool.setuptools.packages.find]
include = ["trading_system*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "tests/",
]
